<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>ZCode 状态灯</title>
</head>

<body>
    <canvas id="pad" width="100" height="100"></canvas>
    <script>
    'use strict';

    // 状态定义:颜色 + 居中符号
    var STATES = {
        idle:       { color: '#6e7681', glyph: '\u25CF' }, // ● 空闲
        ready:      { color: '#3fb950', glyph: '\u2713' }, // ✓ 会话就绪
        done:       { color: '#3fb950', glyph: '\u2713' }, // ✓ 回合完成待输入
        working:    { color: '#2f81f7', glyph: '\u25B6' }, // ▶ 工作中
        permission: { color: '#d29922', glyph: '\u003F' }, // ? 等待授权
        asking:     { color: '#d29922', glyph: '\u003F' }, // ? 向用户提问(闪烁)
        error:      { color: '#f85149', glyph: '\u0021' }  // ! 出错
    };
    var ASK_DIM = '#5c4712';       // asking 闪烁暗相
    var ASK_PULSE_MS = 350;        // asking 时期望的宿主推拍间隔(其余 1s)
    var IDLE_TIMEOUT_MS = 30 * 60 * 1000; // state.json 超 30 分钟未更新 = 空闲

    var canvas = document.getElementById('pad');
    var ctx = canvas.getContext('2d');
    var websocket;
    var contexts = {};        // context 集合(本插件全部键位同色)
    var currentState = 'idle';
    var stateData = null;
    var lastErrLogAt = 0;
    var lastAliveLogAt = 0;
    var blinkOn = false;
    var nextInterval = 1000;  // 回传给宿主的下一拍间隔(自适应节拍契约)

    // 读盘必须走宿主文件桥:WKWebView 禁止 file:// 页面 fetch()/XHR file:// 资源
    // (TypeError: Load failed 即刻拒绝;allowingReadAccessTo 只放行子资源标签加载)
    function readState() {
        return window.opendeckReadFile('state.json').then(atob);
    }

    // 日志经宿主 logMessage 通道;err 限频 30s(首个 hook 事件前 state.json 不存在属正常)
    function logLimited(msg, rateLimitMs) {
        var now = Date.now();
        if (now - lastErrLogAt < rateLimitMs) return;
        lastErrLogAt = now;
        if (websocket && websocket.readyState === 1) {
            websocket.send(JSON.stringify({ event: 'logMessage', payload: { message: msg } }));
        }
    }

    function roundRect(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.arcTo(x + w, y, x + w, y + h, r);
        c.arcTo(x + w, y + h, x, y + h, r);
        c.arcTo(x, y + h, x, y, r);
        c.arcTo(x, y, x + w, y, r);
        c.closePath();
    }

    function render(state, dim) {
        var def = STATES[state] || STATES.idle;
        ctx.clearRect(0, 0, 100, 100);
        ctx.fillStyle = dim ? ASK_DIM : def.color;
        roundRect(ctx, 4, 4, 92, 92, 16);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.font = '56px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(def.glyph, 50, 55);
    }

    function sendImage(context) {
        if (websocket.readyState !== 1) return; // 关闭中 send 会抛,防炸掉单拍
        websocket.send(JSON.stringify({
            event: 'setImage', context: context,
            payload: { image: canvas.toDataURL('image/png'), target: 0 }
        }));
    }

    function pushToAll() {
        Object.keys(contexts).forEach(function (context) { sendImage(context); });
    }

    // 单拍:读 state.json → 变化才重绘上屏(防 HID 刷屏)。
    // 不自链 setTimeout —— 隐藏页面定时器会被 WebKit 治理冻毙(~2 分钟,实测),
    // 节拍由宿主 evaluateJavaScript 推送(见 __opendeckPulse),异常隔离、下拍自愈
    function tick() {
        try {
            readState()
                .then(function (text) {
                    try {
                        var data = JSON.parse(text);
                        if (data && STATES[data.state]) stateData = data;
                    } catch (err) { /* 半截 JSON:保持上一状态 */ }
                })
                .catch(function (err) { logLimited('read state.json failed: ' + err, 30000); })
                .then(function () {
                    var state = 'idle';
                    if (stateData && Date.now() - stateData.updatedAt < IDLE_TIMEOUT_MS) {
                        state = stateData.state;
                    }
                    var asking = state === 'asking';
                    if (asking) { blinkOn = !blinkOn; } else { blinkOn = false; }
                    // asking 每拍都要上屏(亮暗交替即闪烁);其余状态变化才推(防 HID 刷屏)
                    if (state !== currentState || asking) {
                        currentState = state;
                        render(state, asking && blinkOn);
                        pushToAll();
                    }
                    nextInterval = asking ? ASK_PULSE_MS : 1000;
                    if (Date.now() - lastAliveLogAt >= 60000) {
                        lastAliveLogAt = Date.now();
                        logLimited('alive state=' + state + ' ctx=' + Object.keys(contexts).length, 0);
                    }
                });
        } catch (err) {
            logLimited('tick threw: ' + err, 30000);
        }
    }
    // 宿主推拍入口:返回期望的下一拍间隔(自适应节拍;宿主按返回值重排定时器)。
    // 返回的是上一拍结算出的值,节拍自适应有一拍滞后——对闪烁无感知影响
    window.__opendeckPulse = function () {
        tick();
        return nextInterval;
    };

    window.connectElgatoStreamDeckSocket = function (port, uuid, registerEvent, info) {
        JSON.parse(info);
        websocket = new WebSocket('ws://127.0.0.1:' + port);
        websocket.onopen = function () {
            websocket.send(JSON.stringify({ event: registerEvent, uuid: uuid }));
        };
        websocket.onmessage = function (e) {
            var data = JSON.parse(e.data);
            if (data.event === 'willAppear') {
                contexts[data.context] = true;
                render(currentState);
                sendImage(data.context); // 新键上屏(含首键)
            } else if (data.event === 'willDisappear') {
                delete contexts[data.context];
            } else if (data.event === 'deviceDidConnect') {
                pushToAll(); // 设备重连后全量重画
            }
        };
        render(currentState);
        tick(); // 首拍(此时 WS 未开,只更新本地状态;willAppear 到达时按 currentState 上屏)
    };
    </script>
</body>

</html>
